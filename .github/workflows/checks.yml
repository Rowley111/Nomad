name: Nomad checks
on:
  pull_request:
  push:
    branches: [feature/persisted-valuator-stage1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nomad
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: nomad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nomad -d nomad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOMAD_TEST_POSTGRES_URL: postgresql://nomad:ci-local-only@127.0.0.1:5432/nomad_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: python -m pip install -r server/requirements.txt
      - run: npm ci --omit=dev
      - run: python -m pytest server/tests -q
